name: preview cleanup

# Deletes a pull request's preview when the pull request is closed or merged.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# The same group as the pull request's ci run. Starting the clean-up cancels a
# preview that is still being created, so it cannot appear after the delete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete:
    name: delete preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default branch, not the pull request: its merge commit may be gone,
      # and only the lockfile's Wrangler is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Delete the preview
        # A pull request whose checks never passed has no preview; that is not a failure.
        run: |
          if output="$(pnpm exec wrangler preview delete --name "pr-${PR_NUMBER}" --skip-confirmation 2>&1)"; then
            echo "Deleted preview pr-${PR_NUMBER}."
          elif printf '%s' "$output" | grep --quiet "Preview not found"; then
            echo "No preview named pr-${PR_NUMBER}; nothing to delete."
          else
            printf '%s\n' "$output"
            exit 1
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
