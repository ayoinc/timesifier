name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

# A pull request's runs share one group, named after its number, so a newer push
# replaces the run in progress. Pushes to main use their own group and are never
# cancelled: a production deploy always finishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

  # A job of its own, so that it runs beside `checks` and a slow or flaky browser
  # run is told apart from a failed check at a glance.
  browser-tests:
    name: browser tests
    runs-on: ubuntu-24.04
    # Playwright's own image holds the browsers and every system library they
    # need, so the job never waits on Ubuntu's package mirrors. Its version is
    # @playwright/test's in package.json, and its digest is pinned.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    # About 190 tests in two engines.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser tests make their own build, which includes the component
      # gallery, and delete it when they end.
      - run: pnpm test:e2e
      # A failed test's trace (the page at each step, its console and network)
      # and the report, kept for a week, so a failure seen only here can be read.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Migrations reach the database before the new code is live, so a migration
  # that removes or renames something breaks the code still running. Such a
  # migration ships alone, after a release that no longer uses what it removes:
  # its pull request may change `migrations/` and `app/db/schema.ts` only.
  migration-check:
    name: migration check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A migration that drops or renames ships alone
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE...HEAD" -- 'migrations/*.sql')
          [ -n "$added" ] || { echo "No new migration."; exit 0; }
          # shellcheck disable=SC2086 # the names of migrations hold no spaces
          destructive=$(grep -l -i -w -E 'DROP|RENAME' $added || true)
          [ -n "$destructive" ] || { echo "No new migration drops or renames."; exit 0; }
          others=$(git diff --name-only "$BASE...HEAD" | grep -v -E '^(migrations/|app/db/schema\.ts$)' || true)
          [ -z "$others" ] || {
            echo "These migrations drop or rename:"
            echo "$destructive"
            echo "So this pull request may change only migrations/ and app/db/schema.ts. It also changes:"
            echo "$others"
            exit 1
          }
          echo "A migration drops or renames, and the pull request changes nothing else."

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # lets the scanner comment on the line that leaked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Cloudflare token is given only to the steps that call Wrangler, never to
  # install or build, and never to a pull request from a fork.
  preview:
    name: preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, browser-tests, secrets, migration-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # posts the preview URL on the pull request
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before anything is built: a setting that is missing fails the job here,
      # by name. docs/security.md, "Secrets".
      - name: Check this deployment's settings and write them into the Wrangler configuration
        run: node scripts/deploy-config.ts --write
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          CLOUDFLARE_API_TOKEN_IS_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID_IS_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - run: pnpm build
      - name: Apply migrations to the preview database
        run: pnpm exec wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create or update the preview
        id: preview
        # With --json Wrangler still prints progress lines first; the JSON
        # document starts at the first line that is a lone "{".
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview --name "pr-${PR_NUMBER}" --json)"
          url="$(printf '%s\n' "$output" | awk '/^\{$/ { json = 1 } json' | jq -er '.preview.urls[0]')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: ./scripts/smoke.sh "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
      - name: Comment with the preview URL
        # The commit named is the pull request's head, the one its author pushed.
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview of ${HEAD_SHA::7}: ${PREVIEW_URL}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, browser-tests, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before anything is built or migrated: a setting that is missing fails the
      # job here, by name. docs/security.md, "Secrets".
      - name: Check this deployment's settings and write them into the Wrangler configuration
        id: settings
        run: node scripts/deploy-config.ts --write
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          CLOUDFLARE_API_TOKEN_IS_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID_IS_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - run: pnpm build
      # Migrations go first, so each one must work with the code already live:
      # add in one release, stop using in the next, remove in a third.
      - name: Apply migrations to the production database
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to production
        id: deploy
        # The version message is the commit id and the first line of its message.
        # Each version also gets an address on workers.dev, named after the first
        # part of its id; the smoke test checks that address serves nothing.
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --message "${GITHUB_SHA::7} ${COMMIT_MESSAGE%%$'\n'*}" | tee deploy.log
          version="$(sed -n 's/^Current Version ID: //p' deploy.log)"
          echo "version_host=${version%%-*}${HOST_SUFFIX}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HOST_SUFFIX: ${{ steps.settings.outputs.host_suffix }}
      - name: Smoke test
        run: ./scripts/smoke.sh "$ORIGIN" --production "$VERSION_HOST"
        env:
          ORIGIN: ${{ steps.settings.outputs.origin }}
          VERSION_HOST: ${{ steps.deploy.outputs.version_host }}
