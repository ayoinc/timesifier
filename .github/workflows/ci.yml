name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

# A pull request's runs share one group, named after its number, so a newer push
# replaces the run in progress. Pushes to main use their own group and are never
# cancelled: a production deploy always finishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Everything of `checks` but the Workers tests: typecheck, lint, the Node tests
  # (the `node` project of vitest.config.ts), the build and the audit. About 2
  # minutes on the runner on 2026-11-24.
  static-checks:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --project node
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

  # The tests in the Workers runtime (the `workers` project), about 5,100 in 195
  # files, took 23 minutes in one job on 2026-11-24 (main's run 45357831172),
  # against a limit of 25. So they run in four shards side by side, each with its
  # own install and Miniflare. Vitest splits the files between them by count
  # (`--shard`), in the order of a hash of each file's path, so every file runs
  # in exactly one shard; by that run's times each shard holds 12 to 14 minutes
  # of tests, run three at a time.
  unit-shards:
    name: unit shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    # About twice the slowest shard measured, so a slow day passes and a hang does not.
    timeout-minutes: 15
    strategy:
      # Every shard runs to its end, so the log holds every failure at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --project workers --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}

  # The one result branch protection asks for, and what `preview` and `deploy`
  # wait on: it fails unless the static checks and every unit shard passed, and
  # it runs when one failed or was cancelled, because a required check that is
  # skipped counts as passed.
  checks:
    name: checks
    if: ${{ always() }}
    needs: [static-checks, unit-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The static checks and every unit shard passed
        env:
          STATIC: ${{ needs.static-checks.result }}
          SHARDS: ${{ needs.unit-shards.result }}
        run: |
          [ "$STATIC" = success ] || { echo "The static checks ended: $STATIC."; exit 1; }
          [ "$SHARDS" = success ] || { echo "The unit shards ended: $SHARDS."; exit 1; }
          echo "The static checks and every unit shard passed."

  # Jobs of their own, so that they run beside `checks` and a slow or flaky
  # browser run is told apart from a failed check at a glance. About 700 tests in
  # two engines took 33 to 44 minutes in one job on 2026-11-23, so they run in four
  # shards side by side, each with its own build, server and database. Playwright
  # splits them by count (`--shard`); the slowest quarter took about 13 minutes of
  # tests in the runs measured.
  browser-shards:
    name: browser shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    # Playwright's own image holds the browsers and every system library they
    # need, so the job never waits on Ubuntu's package mirrors. Its version is
    # @playwright/test's in package.json, and its digest is pinned.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
    # Twice the slowest shard measured, so a slow day passes and a hang does not.
    timeout-minutes: 30
    strategy:
      # Every shard runs to its end, so the report holds every failure at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Two passes, so the tests that seed the database run after every other test
      # of this shard, one at a time (playwright.config.ts, E2E_PASS). The first
      # makes the build, which includes the component gallery, and keeps it for
      # the second, which deletes it when it ends. Each writes its report as a blob.
      - name: Every test but the ones that seed the database
        run: pnpm test:e2e --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
          E2E_PASS: first
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/${{ matrix.shard }}-first.zip
      # Also after a failure in the first pass, so the report holds these too.
      - name: The tests that seed the database, one at a time
        if: ${{ !cancelled() }}
        run: pnpm test:e2e --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
          E2E_PASS: seeded
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/${{ matrix.shard }}-seeded.zip
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # The one result branch protection asks for, and what `preview` and `deploy`
  # wait on: it fails unless every shard passed, and it runs when one failed or
  # was cancelled, because a required check that is skipped counts as passed.
  browser-tests:
    name: browser tests
    if: ${{ always() }}
    needs: [browser-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: blob-report
          merge-multiple: true
      # One report of every shard: each test's result and time, and a failed
      # test's trace (the page at each step, its console and network), kept for a
      # week, so a failure seen only here can be read.
      - run: pnpm exec playwright merge-reports --reporter html blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: playwright-report/
          retention-days: 7
      - name: Every shard passed
        if: ${{ always() }}
        env:
          SHARDS: ${{ needs.browser-shards.result }}
        run: |
          [ "$SHARDS" = success ] || { echo "The browser shards ended: $SHARDS."; exit 1; }
          echo "Every browser shard passed."

  # Migrations reach the database before the new code is live, so a migration
  # that removes or renames something breaks the code still running. Such a
  # migration ships alone, after a release that no longer uses what it removes:
  # its pull request may change `migrations/` and `app/db/schema.ts` only.
  migration-check:
    name: migration check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A migration that drops or renames ships alone
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          added=$(git diff --name-only --diff-filter=A "$BASE...HEAD" -- 'migrations/*.sql')
          [ -n "$added" ] || { echo "No new migration."; exit 0; }
          # shellcheck disable=SC2086 # the names of migrations hold no spaces
          destructive=$(grep -l -i -w -E 'DROP|RENAME' $added || true)
          [ -n "$destructive" ] || { echo "No new migration drops or renames."; exit 0; }
          others=$(git diff --name-only "$BASE...HEAD" | grep -v -E '^(migrations/|app/db/schema\.ts$)' || true)
          [ -z "$others" ] || {
            echo "These migrations drop or rename:"
            echo "$destructive"
            echo "So this pull request may change only migrations/ and app/db/schema.ts. It also changes:"
            echo "$others"
            exit 1
          }
          echo "A migration drops or renames, and the pull request changes nothing else."

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # lets the scanner comment on the line that leaked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Cloudflare token is given only to the steps that call Wrangler, never to
  # install or build, and never to a pull request from a fork.
  preview:
    name: preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, browser-tests, secrets, migration-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # posts the preview URL on the pull request
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before anything is built: a setting that is missing fails the job here,
      # by name. docs/security.md, "Secrets".
      - name: Check this deployment's settings and write them into the Wrangler configuration
        run: node scripts/deploy-config.ts --write
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_COMPANY_NUMBER: ${{ vars.OPERATOR_COMPANY_NUMBER }}
          OPERATOR_REGISTERED_IN: ${{ vars.OPERATOR_REGISTERED_IN }}
          OPERATOR_REGISTERED_OFFICE: ${{ vars.OPERATOR_REGISTERED_OFFICE }}
          OPERATOR_ICO_REFERENCE: ${{ vars.OPERATOR_ICO_REFERENCE }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN_IS_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID_IS_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - run: pnpm build
      - name: Apply migrations to the preview database
        run: pnpm exec wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create or update the preview
        id: preview
        # With --json Wrangler still prints progress lines first; the JSON
        # document starts at the first line that is a lone "{".
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview --name "pr-${PR_NUMBER}" --json)"
          url="$(printf '%s\n' "$output" | awk '/^\{$/ { json = 1 } json' | jq -er '.preview.urls[0]')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: ./scripts/smoke.sh "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
      - name: Comment with the preview URL
        # The commit named is the pull request's head, the one its author pushed.
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview of ${HEAD_SHA::7}: ${PREVIEW_URL}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, browser-tests, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before anything is built or migrated: a setting that is missing fails the
      # job here, by name. docs/security.md, "Secrets".
      - name: Check this deployment's settings and write them into the Wrangler configuration
        id: settings
        run: node scripts/deploy-config.ts --write
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          OPERATOR_NAME: ${{ vars.OPERATOR_NAME }}
          OPERATOR_COMPANY_NUMBER: ${{ vars.OPERATOR_COMPANY_NUMBER }}
          OPERATOR_REGISTERED_IN: ${{ vars.OPERATOR_REGISTERED_IN }}
          OPERATOR_REGISTERED_OFFICE: ${{ vars.OPERATOR_REGISTERED_OFFICE }}
          OPERATOR_ICO_REFERENCE: ${{ vars.OPERATOR_ICO_REFERENCE }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN_IS_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID_IS_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - run: pnpm build
      # Migrations go first, so each one must work with the code already live:
      # add in one release, stop using in the next, remove in a third.
      - name: Apply migrations to the production database
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to production
        id: deploy
        # The version message is the commit id and the first line of its message.
        # Each version also gets an address on workers.dev, named after the first
        # part of its id; the smoke test checks that address serves nothing.
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --message "${GITHUB_SHA::7} ${COMMIT_MESSAGE%%$'\n'*}" | tee deploy.log
          version="$(sed -n 's/^Current Version ID: //p' deploy.log)"
          echo "version_host=${version%%-*}${HOST_SUFFIX}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HOST_SUFFIX: ${{ steps.settings.outputs.host_suffix }}
      - name: Smoke test
        run: ./scripts/smoke.sh "$ORIGIN" --production "$VERSION_HOST"
        env:
          ORIGIN: ${{ steps.settings.outputs.origin }}
          VERSION_HOST: ${{ steps.deploy.outputs.version_host }}
