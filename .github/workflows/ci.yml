name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

# A pull request's runs share one group, named after its number, so a newer push
# replaces the run in progress. Pushes to main use their own group and are never
# cancelled: a production deploy always finishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    # The browser tests take most of it: about 190 tests in two engines.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Browser tests make their own build, which includes the component gallery,
      # and delete it when they end. The deploy job builds for itself.
      - name: Install the browsers the tests use
        run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - name: Dependency audit
        run: pnpm audit --audit-level=moderate

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # lets the scanner comment on the line that leaked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Cloudflare token is given only to the steps that call Wrangler, never to
  # install or build, and never to a pull request from a fork.
  preview:
    name: preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [checks, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # posts the preview URL on the pull request
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before anything is built: a setting that is missing fails the job here,
      # by name. docs/security.md, "Secrets".
      - name: Check this deployment's settings and write them into the Wrangler configuration
        run: node scripts/deploy-config.ts --write
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          CLOUDFLARE_API_TOKEN_IS_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID_IS_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - run: pnpm build
      - name: Apply migrations to the preview database
        run: pnpm exec wrangler d1 migrations apply PREVIEW_DB --remote --config wrangler.preview-migrations.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create or update the preview
        id: preview
        # With --json Wrangler still prints progress lines first; the JSON
        # document starts at the first line that is a lone "{".
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview --name "pr-${PR_NUMBER}" --json)"
          url="$(printf '%s\n' "$output" | awk '/^\{$/ { json = 1 } json' | jq -er '.preview.urls[0]')"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        run: ./scripts/smoke.sh "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
      - name: Comment with the preview URL
        # The commit named is the pull request's head, the one its author pushed.
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview of ${HEAD_SHA::7}: ${PREVIEW_URL}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before anything is built or migrated: a setting that is missing fails the
      # job here, by name. docs/security.md, "Secrets".
      - name: Check this deployment's settings and write them into the Wrangler configuration
        id: settings
        run: node scripts/deploy-config.ts --write
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_PREVIEW_DATABASE_ID: ${{ vars.D1_PREVIEW_DATABASE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          CLOUDFLARE_API_TOKEN_IS_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID_IS_SET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      - run: pnpm build
      # Migrations go first, so each one must work with the code already live:
      # add in one release, stop using in the next, remove in a third.
      - name: Apply migrations to the production database
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to production
        id: deploy
        # The version message is the commit id and the first line of its message.
        # Each version also gets an address on workers.dev, named after the first
        # part of its id; the smoke test checks that address serves nothing.
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --message "${GITHUB_SHA::7} ${COMMIT_MESSAGE%%$'\n'*}" | tee deploy.log
          version="$(sed -n 's/^Current Version ID: //p' deploy.log)"
          echo "version_host=${version%%-*}${HOST_SUFFIX}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          HOST_SUFFIX: ${{ steps.settings.outputs.host_suffix }}
      - name: Smoke test
        run: ./scripts/smoke.sh "$ORIGIN" --production "$VERSION_HOST"
        env:
          ORIGIN: ${{ steps.settings.outputs.origin }}
          VERSION_HOST: ${{ steps.deploy.outputs.version_host }}
