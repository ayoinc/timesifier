openapi: 3.1.0
info:
  title: Timesifier API
  version: "1"
  description: >
    The public API (TS-081). A token acts as the person who made it, with
    their role as it is, within its scopes. Documented at
    https://timesifier.com/developers/api, which is docs/api.md.
servers:
  - url: https://timesifier.com/api/v1
security:
  - token: []
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: An API token, `tsf_` and 43 characters, made on Integrations.
  parameters:
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
    UserId: { name: user_id, in: query, schema: { type: string } }
    ProjectId: { name: project_id, in: query, schema: { type: string } }
    PerPage:
      {
        name: per_page,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 100 },
      }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
  headers:
    RetryAfter:
      description: Seconds to wait before the next request.
      schema: { type: integer }
  schemas:
    Ref:
      type: [object, "null"]
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
    CodedRef:
      type: [object, "null"]
      description: A client, project or work package with its code, null when it has none (TS-115a, TS-115b).
      properties:
        id: { type: string }
        name: { type: [string, "null"] }
        code: { type: [string, "null"] }
    Client:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: [string, "null"], description: "The client's code, for example ACME." }
        archived: { type: boolean }
        currency: { type: string }
    Project:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: [string, "null"], description: "The project's code, for example ACME-001." }
        client: { $ref: "#/components/schemas/CodedRef" }
        archived: { type: boolean }
        billing_type: { type: string, description: Only for those who see money. }
        rate_mode: { type: string, description: Only for those who see money. }
        fee_minor: { type: [integer, "null"], description: Only for those who see money. }
        currency: { type: [string, "null"], description: Only for those who see money. }
        budget: { type: object, description: Only for those who see money. }
    WorkPackage:
      type: object
      description: A part of a project (TS-115b). While a project has an open one, its new and changed entries name one.
      properties:
        id: { type: string }
        project_id: { type: string }
        code:
          {
            type: string,
            description: "Unique in its project whatever its letters' case, for example WP2.",
          }
        name: { type: string }
        starts_on: { type: [string, "null"], format: date }
        ends_on: { type: [string, "null"], format: date }
        state: { type: string, enum: [open, closed], description: A closed one takes no new time. }
        billable: { type: boolean }
        archived: { type: boolean }
        budget:
          type: [object, "null"]
          description: Hours in minutes; fees in minor units, only for those who see money.
          properties:
            kind: { type: string, enum: [hours, fees] }
            amount: { type: [integer, "null"] }
    ProjectMember:
      type: object
      description: >
        A stretch of a person on a project's team (TS-115c). No two stretches of
        one person on one project share a day.
      properties:
        id: { type: string }
        project_id: { type: string }
        user: { $ref: "#/components/schemas/Ref" }
        role: { type: string, enum: [member, delivery_manager] }
        starts_on: { type: string, format: date }
        ends_on:
          type: [string, "null"]
          format: date
          description: Its last day; null while it runs on.
        source: { type: string, enum: [manual, import, contract], description: What made it. }
    NewProjectMember:
      type: object
      additionalProperties: false
      required: [project_id, user_id, role, starts_on]
      properties:
        project_id: { type: string }
        user_id: { type: string, description: A member of the organisation. }
        role:
          type: string
          enum: [member, delivery_manager]
          description: Only owners, admins and the client's account managers name a delivery manager.
        starts_on: { type: string, format: date }
        ends_on:
          type: [string, "null"]
          format: date
          description: Left out or null, it runs on.
    ProjectMemberChange:
      description: Its last day, or its role from a day.
      oneOf:
        - type: object
          additionalProperties: false
          required: [ends_on]
          properties:
            ends_on: { type: [string, "null"], format: date, description: Null, it runs on. }
        - type: object
          additionalProperties: false
          required: [role, from]
          properties:
            role: { type: string, enum: [member, delivery_manager] }
            from:
              type: string
              format: date
              description: >
                On or before its first day, the stretch's own role changes;
                later, it ends the day before and a new stretch of the new role
                runs on.
    Allocation:
      type: object
      description: >
        A person's time share of a project, or of one of its work packages
        (TS-116). No two shares of one person on one line share a day.
      properties:
        id: { type: string }
        user_id: { type: string }
        project_id: { type: string }
        work_package_id:
          type: [string, "null"]
          description: Null for a share of the whole project.
        starts_on: { type: string, format: date }
        ends_on:
          type: [string, "null"]
          format: date
          description: Its last day; null while it runs on.
        amount:
          type: number
          description: In its unit, to two decimal places, for example 2.5 days or 22.5 hours.
        unit:
          type: string
          enum: [days, hours, percent]
          description: Days a week, hours a week, or a percentage of the person's schedule.
        amount_text:
          type: string
          description: "The amount in words, for example 2.5 days a week, 22:30 a week, 50% of their schedule."
    NewAllocation:
      type: object
      additionalProperties: false
      required: [user_id, project_id, starts_on, amount, unit]
      properties:
        user_id: { type: string, description: A member of the organisation. }
        project_id: { type: string }
        work_package_id:
          type: [string, "null"]
          description: One of the project's; left out or null, a share of the whole project.
        starts_on: { type: string, format: date }
        ends_on:
          type: [string, "null"]
          format: date
          description: Left out or null, it runs on.
        amount:
          type: number
          exclusiveMinimum: 0
          description: Up to 7 days, 168 hours or 100 percent, to two decimal places.
        unit: { type: string, enum: [days, hours, percent] }
    AllocationChange:
      description: Its last day, or its amount from a day.
      oneOf:
        - type: object
          additionalProperties: false
          required: [ends_on]
          properties:
            ends_on: { type: [string, "null"], format: date, description: Null, it runs on. }
        - type: object
          additionalProperties: false
          required: [amount, unit]
          properties:
            amount: { type: number, exclusiveMinimum: 0 }
            unit: { type: string, enum: [days, hours, percent] }
            from:
              type: string
              format: date
              description: >
                Left out, the share's first day. On or before its first day,
                the share's own amount changes; later, it ends the day before
                and a new share of the new amount runs on.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
    TimeEntry:
      type: object
      properties:
        id: { type: string }
        user: { $ref: "#/components/schemas/Ref" }
        project: { $ref: "#/components/schemas/CodedRef" }
        client: { $ref: "#/components/schemas/CodedRef" }
        task: { $ref: "#/components/schemas/Ref" }
        work_package_id: { type: [string, "null"] }
        work_package: { $ref: "#/components/schemas/CodedRef" }
        spent_date: { type: string, format: date }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        running: { type: boolean }
        hours: { type: number }
        overtime: { type: boolean, description: Overtime rather than regular time (TS-095). }
        billable: { type: boolean }
        description: { type: [string, "null"], description: Only with descriptions:read. }
        import_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NewTimeEntry:
      type: object
      additionalProperties: false
      required: [project_id, hours]
      properties:
        user_id: { type: string, description: The maker's own id, if sent. }
        project_id: { type: string }
        task_id: { type: string }
        work_package_id:
          type: [string, "null"]
          description: Required while the project has an open work package; it must be open and of the project.
        spent_date: { type: string, format: date }
        started_at: { type: string, format: date-time }
        hours: { type: number, exclusiveMinimum: 0, maximum: 24 }
        description: { type: [string, "null"], maxLength: 2000 }
        overtime: { type: boolean, description: Overtime, as the rules allow. }
    TimeEntryChange:
      type: object
      additionalProperties: false
      properties:
        project_id: { type: string }
        task_id: { type: string }
        work_package_id:
          type: [string, "null"]
          description: Left out, the entry keeps its own. A change adding time names an open one where the project has one.
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        hours: { type: number, exclusiveMinimum: 0, maximum: 24 }
        description: { type: [string, "null"], maxLength: 2000 }
        overtime: { type: boolean, description: Overtime, as the rules allow. }
    Page:
      type: object
      properties:
        data: { type: array, items: {} }
        next_cursor: { type: [string, "null"] }
  responses:
    Error:
      description: See docs/api.md for the codes.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /me:
    get:
      summary: The token's maker, organisation, role and scopes
      description: Scope time:read.
      responses:
        "200": { description: The caller. }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /users:
    get:
      summary: The people the maker may see
      description: Scope people:read. Email only for owners and admins.
      responses:
        "200": { description: "`{ data }`" }
        default: { $ref: "#/components/responses/Error" }
  /clients:
    get:
      summary: Clients
      description: Scope projects:read; for owners, admins and Finance while Clients is on.
      responses:
        "200":
          description: "`{ data }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Client" } }
        default: { $ref: "#/components/responses/Error" }
  /projects:
    get:
      summary: Projects
      description: Scope projects:read. Money fields only for those who see money.
      responses:
        "200":
          description: "`{ data }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Project" } }
        default: { $ref: "#/components/responses/Error" }
  /tasks:
    get:
      summary: Tasks, and the projects each is on
      description: Scope projects:read.
      responses:
        "200": { description: "`{ data }`" }
        default: { $ref: "#/components/responses/Error" }
  /work_packages:
    get:
      summary: Each project's work packages, by project and code
      description: Scope projects:read.
      parameters:
        - name: project_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: "`{ data }`"
          content:
            application/json:
              schema:
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WorkPackage" } }
        default: { $ref: "#/components/responses/Error" }
  /project_members:
    get:
      summary: Stretches of people on projects' teams, by id
      description: >
        Scope projects:read. The whole team to owners, admins, Finance,
        managers of teams, the client's account managers and the project's
        delivery managers; anyone else's own stretches alone. A project_id
        that is not the organisation's answers 404.
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of stretches.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Puts a person on a project's team for a stretch
      description: >
        Scope projects:write. Owners, admins, the client's account managers and
        the project's delivery managers. 409 overlaps; 422 ends_before_start or
        not_member. Recorded in the activity log via API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewProjectMember" }
      responses:
        "201":
          description: The stretch.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        default: { $ref: "#/components/responses/Error" }
  /project_members/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: One stretch
      description: Scope projects:read.
      responses:
        "200":
          description: The stretch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      summary: Ends a stretch, or changes its role from a day
      description: >
        Scope projects:write. A delivery manager's stretch only owners, admins
        and the client's account managers change. Answers the stretch as it is
        after, the new one when the role changed from a later day.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectMemberChange" }
      responses:
        "200":
          description: The stretch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectMember" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Takes away a stretch put there in error
      description: Scope projects:write. 409 has_time when its person tracked time to the project in it.
      responses:
        "204": { description: Taken away. }
        default: { $ref: "#/components/responses/Error" }
  /allocations:
    get:
      summary: Time shares, by id
      description: >
        Scope projects:read. Every share to owners and admins; anyone else
        their own, those of the people in teams they manage, and every share on
        the projects they lead as delivery manager or whose client they are
        account manager of. from and to keep the shares that run on any day
        between them. A project_id that is not the organisation's answers 404.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of time shares.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Allocation" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Gives a person a time share of a project or work package
      description: >
        Scope projects:write. Owners, admins, the client's account managers and
        the project's delivery managers. 409 overlaps; 422 ends_before_start,
        amount, work_package or not_member. Recorded in the activity log via
        API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewAllocation" }
      responses:
        "201":
          description: The share.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Allocation" }
        default: { $ref: "#/components/responses/Error" }
  /allocations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: One time share
      description: Scope projects:read.
      responses:
        "200":
          description: The share.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Allocation" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      summary: Ends a time share, or changes its amount from a day
      description: >
        Scope projects:write. The same people as for POST. Answers the share as
        it is after, the new one when the amount changed from a later day.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllocationChange" }
      responses:
        "200":
          description: The share.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Allocation" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Removes a time share, all of its days
      description: Scope projects:write. The same people as for POST.
      responses:
        "204": { description: Removed. }
        default: { $ref: "#/components/responses/Error" }
  /time_entries:
    get:
      summary: Time entries the maker may see, newest first
      description: Scope time:read.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Page"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/TimeEntry" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Adds an entry of the maker's
      description: Scope time:write. Recorded in the activity log via API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewTimeEntry" }
      responses:
        "201":
          description: The entry.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }
        default: { $ref: "#/components/responses/Error" }
  /time_entries/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: One entry
      description: Scope time:read.
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      summary: Changes an entry of the maker's that has ended
      description: Scope time:write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeEntryChange" }
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      summary: Deletes an entry of the maker's that has ended
      description: Scope time:write.
      responses:
        "204": { description: Deleted. }
        default: { $ref: "#/components/responses/Error" }
  /leave:
    get:
      summary: Approved leave of everyone, and the maker's own requests
      description: Scope people:read. The kind only where the role sees it.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: "`{ data }`" }
        default: { $ref: "#/components/responses/Error" }
  /work_days:
    get:
      summary: One row a person and day, with the schedule in force and the hours expected
      description: >
        Scope time:read. from and to are required, at most 62 days apart.
        user_id is the maker's own when not given, and only a person whose time
        the maker may see.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - $ref: "#/components/parameters/UserId"
      responses:
        "200": { description: "`{ data }`" }
        default: { $ref: "#/components/responses/Error" }
  /expenses:
    get:
      summary: Expenses the maker may see, newest first
      description: Scope expenses:read. Notes with descriptions:read.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: "`{ data, next_cursor }`" }
        default: { $ref: "#/components/responses/Error" }
  /invoices:
    get:
      summary: Invoices, newest first
      description: Scope invoices:read; owners, admins and Finance.
      parameters:
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: "`{ data, next_cursor }`" }
        default: { $ref: "#/components/responses/Error" }
