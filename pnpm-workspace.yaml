# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary and `esbuild` downloads/
# builds native bindings. Without these, pnpm 11+ aborts the install with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.20"
  - "@better-auth/drizzle-adapter@1.7.20"
  - "@better-auth/kysely-adapter@1.7.20"
  - "@better-auth/memory-adapter@1.7.20"
  - "@better-auth/mongo-adapter@1.7.20"
  - "@better-auth/passkey@1.7.20"
  - "@better-auth/prisma-adapter@1.7.20"
  - "@better-auth/telemetry@1.7.20"
  - better-auth@1.7.20
